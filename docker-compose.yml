services:
  db:
    image: postgres:16-alpine
    container_name: cuhc-db
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal

  web:
    build: ./app
    container_name: cuhc-web
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./images:/app/images
      - ./snapshots:/app/snapshots
    depends_on:
      - db
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: cuhc-proxy
    restart: unless-stopped
    ports:
      - "8083:8083"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
    driver: bridge

